name: Update current download page

on:
  release:
    types: [published, released, prereleased, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-current-download-page
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release events otherwise check out the release tag, leaving HEAD
          # detached and making the final `git push` fail.
          ref: main

      - name: Generate links from published release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_download_page.py

      - name: Verify generated page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_download_page.py --check
          git diff --check

      - name: Commit the updated downloads and manual
        run: |
          if git diff --quiet -- README.md manual/; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md manual/
          git commit -m "Update current downloads and user manual"
          git push
